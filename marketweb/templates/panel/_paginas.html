{% if pagina.paginator.num_pages > 1 %}
<nav class="pn-paginas" aria-label="Paginación">
    {% if pagina.has_previous %}
    <a class="pn-btn pn-btn--claro pn-btn--sm" href="?{% if qs_sin_pagina %}{{ qs_sin_pagina }}&amp;{% endif %}pagina={{ pagina.previous_page_number }}">← Anterior</a>
    {% endif %}
    <span>Página {{ pagina.number }} de {{ pagina.paginator.num_pages }} · {{ pagina.paginator.count }} registros</span>
    {% if pagina.has_next %}
    <a class="pn-btn pn-btn--claro pn-btn--sm" href="?{% if qs_sin_pagina %}{{ qs_sin_pagina }}&amp;{% endif %}pagina={{ pagina.next_page_number }}">Siguiente →</a>
    {% endif %}
</nav>
{% endif %}
